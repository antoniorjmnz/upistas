# Norma de pagos v3 (hoja Norma_Pagos_v3 del Excel de Alberto).
# Cada regla: qué resultado provoca si falla. Si fallan varias gana la de mayor prioridad, y a
# igual prioridad la más restrictiva (NO_PAGAR > ESCALAR > PAGAR).
# Escalones: 400 no se puede verificar · 350 incumplimiento probado · 340 factura en otra moneda ·
# 300 revisión por el contenido del documento · 100 pago previo · 50 avisos. Reglas en src/upistas/dominio/reglas/.
# El criterio está en docs/adr/002-criterio.md; los tipos de cambio de referencia, en divisas.toml (misma carpeta).
version = "v3"

[reglas.R1_nif_iban]
si_falla = "NO_PAGAR"
prioridad = 350

[reglas.R2_pedido_importe]
si_falla = "NO_PAGAR"
prioridad = 350
[reglas.R2_pedido_importe.params]
tolerancia = "0.01"

[reglas.R2_divisa]
si_falla = "ESCALAR"
prioridad = 340

[reglas.R3_iva_total]
si_falla = "NO_PAGAR"
prioridad = 350
[reglas.R3_iva_total.params]
tolerancia = "0.01"

[reglas.R5_erp_pendiente]
si_falla = "ESCALAR"

[reglas.R5_no_pagada]
si_falla = "NO_PAGAR"
prioridad = 100

[reglas.R5_hash_previo]
si_falla = "NO_PAGAR"
prioridad = 100

[reglas.R0_lectura]
si_falla = "ESCALAR"
prioridad = 400

[reglas.R3_datos_fiscales]
si_falla = "ESCALAR"
prioridad = 300

[reglas.R6_evaluacion_disponible]
si_falla = "ESCALAR"
prioridad = 400

[reglas.R6_maestro_verificable]
si_falla = "ESCALAR"
prioridad = 400

[reglas.R6_proveedor_referencias]
si_falla = "ESCALAR"
prioridad = 50

[reglas.R6_revision_interna]
si_falla = "ESCALAR"
prioridad = 50

[reglas.R6_notas]
si_falla = "ESCALAR"
prioridad = 300

[reglas.R6_contenido_oculto]
si_falla = "ESCALAR"
prioridad = 300

[reglas.R4_fecha]
si_falla = "NO_PAGAR"
prioridad = 350

# Qué provoca cada regla al fallar y por qué, de mayor a menor prioridad:
# R0_lectura → ESCALAR: un dato no se pudo leer; sin dato seguro no se da por probado ningún incumplimiento.
# R6_evaluacion_disponible → ESCALAR: hay notas y no se pudo evaluar su significado.
# R1_nif_iban → NO_PAGAR: NIF fuera del maestro o IBAN distinto; incumple la regla 1 con seguridad.
# R2_pedido_importe → NO_PAGAR: pedido inexistente o importe distinto; incumple la regla 2 con seguridad.
#   En otra moneda el importe no se compara (tampoco el IVA en R3): eso lo dice R2_divisa.
# R3_iva_total → NO_PAGAR: total ≠ base + IVA, o cuota distinta del tipo impreso; incumple la regla 3.
# R4_fecha → NO_PAGAR: fecha imposible (31/02) o futura; incumple la regla 4.
# R2_divisa → ESCALAR: factura en otra moneda; se dice cuánto sale al tipo de referencia y si cuadra, y paga Alberto.
#   Por debajo de R1 y R2: una prueba independiente de la divisa (IBAN, pedido de otro o inexistente, ya pagado) sigue siendo NO_PAGAR.
# R3_datos_fiscales → ESCALAR: importes negativos o sin tipo de IVA impreso para contrastar la cuota; no tapa una suma mal hecha.
# R6_notas → ESCALAR: nota relevante o instrucción en el documento; la mira una persona aunque el ERP diga PAGADA.
# R6_contenido_oculto → ESCALAR: texto oculto o caracteres invisibles; la mira una persona.
# R5_no_pagada → NO_PAGAR: pedido ya pagado en el ERP o aprobado en otro lote; nunca pagar dos veces.
# R5_hash_previo → NO_PAGAR: el mismo documento ya se aprobó en otro lote.
# R6_proveedor_referencias → ESCALAR: Excel y ERP se contradicen sobre el proveedor, el maestro no permite contrastarlo o el pedido es de otro proveedor.
# R6_maestro_verificable → ESCALAR: el maestro no permite contrastar el NIF o el IBAN del proveedor del pedido; sin dato no se prueba nada.
# R6_revision_interna → ESCALAR: pedido apuntado por Alberto en pendiente_revisar.
# R5_erp_pendiente → ESCALAR: sin asiento en el ERP o estado no pendiente; falta la referencia oficial.
