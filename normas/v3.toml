# Norma de pagos v3 (hoja Norma_Pagos_v3 del Excel de Alberto).
# Cada regla: qué resultado provoca si falla. Si fallan varias gana la de mayor prioridad, y a
# igual prioridad la más restrictiva (NO_PAGAR > ESCALAR > PAGAR).
# Escalones: 400 no se puede verificar · 350 incumplimiento probado · 300 revisión por el
# contenido del documento · 100 pago previo · 50 avisos. Reglas en src/upistas/dominio/reglas/.
version = "v3"

[reglas.R1_nif_iban]
si_falla = "NO_PAGAR"
prioridad = 350

[reglas.R2_pedido_importe]
si_falla = "NO_PAGAR"
prioridad = 350
[reglas.R2_pedido_importe.params]
tolerancia = "0.01"

[reglas.R3_iva_total]
si_falla = "NO_PAGAR"
prioridad = 350
[reglas.R3_iva_total.params]
tolerancia = "0.01"
tipos_iva = [21, 10, 4]

[reglas.R5_erp_pendiente]
si_falla = "ESCALAR"

[reglas.R5_no_pagada]
si_falla = "NO_PAGAR"
prioridad = 100

[reglas.R5_hash_previo]
si_falla = "NO_PAGAR"
prioridad = 100

[reglas.R0_lectura]
si_falla = "ESCALAR"
prioridad = 400

[reglas.R3_datos_fiscales]
si_falla = "ESCALAR"
prioridad = 400

[reglas.R6_evaluacion_disponible]
si_falla = "ESCALAR"
prioridad = 400

[reglas.R6_maestro_verificable]
si_falla = "ESCALAR"
prioridad = 400

[reglas.R6_proveedor_referencias]
si_falla = "ESCALAR"
prioridad = 50

[reglas.R6_revision_interna]
si_falla = "ESCALAR"
prioridad = 50

[reglas.R6_notas]
si_falla = "ESCALAR"
prioridad = 300

[reglas.R6_contenido_oculto]
si_falla = "ESCALAR"
prioridad = 300

# Una fecha inválida y una ilegible acaban las dos sin valor, así que R0_lectura (400) escala
# antes de que esta regla pueda distinguirlas. Hasta que la lectura las separe, se queda en ESCALAR.
[reglas.R4_fecha]
si_falla = "ESCALAR"
