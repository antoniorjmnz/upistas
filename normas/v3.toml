# Norma de pagos v3 (hoja Norma_Pagos_v3 del Excel de Alberto).
# Cada regla: qué resultado provoca si falla. Si fallan varias, gana la más restrictiva
# (NO_PAGAR > ESCALAR > PAGAR). Las reglas viven en src/upistas/dominio/reglas/.
version = "v3"

[reglas.R1_nif_iban]
si_falla = "ESCALAR"

[reglas.R2_pedido_importe]
si_falla = "ESCALAR"
[reglas.R2_pedido_importe.params]
tolerancia = "0.01"

[reglas.R3_iva_total]
si_falla = "NO_PAGAR"
prioridad = 350
[reglas.R3_iva_total.params]
tolerancia = "0.01"
tipos_iva = [21, 10, 4]

[reglas.R5_erp_pendiente]
si_falla = "ESCALAR"

[reglas.R5_no_pagada]
si_falla = "NO_PAGAR"
prioridad = 100

[reglas.R5_hash_previo]
si_falla = "NO_PAGAR"
prioridad = 100

[reglas.R0_lectura]
si_falla = "ESCALAR"
prioridad = 400

[reglas.R3_datos_fiscales]
si_falla = "ESCALAR"
prioridad = 400

[reglas.R6_evaluacion_disponible]
si_falla = "ESCALAR"
prioridad = 400

[reglas.R6_proveedor_referencias]
si_falla = "ESCALAR"
prioridad = 50

[reglas.R6_revision_interna]
si_falla = "ESCALAR"
prioridad = 50

[reglas.R6_notas]
si_falla = "ESCALAR"
prioridad = 300

[reglas.R6_contenido_oculto]
si_falla = "ESCALAR"
prioridad = 300

# 4. La fecha debe ser válida y no futura.
[reglas.R4_fecha]
si_falla = "ESCALAR"

# Pendientes de implementar (issue del motor de reglas):
# 1. NIF en el maestro y IBAN coincide            → R1_nif_iban
# 2. Pedido existe, es del proveedor, importe ±0,01 → R2_pedido_importe
# 3. IVA bien calculado y total = base + IVA       → R3_iva_total
# 5. Pedido PENDIENTE en ERP, nunca pagar dos veces → R5_erp_pendiente
# 6. Ante duda razonable, ESCALAR                 → implícito: lectura dudosa = ESCALAR
