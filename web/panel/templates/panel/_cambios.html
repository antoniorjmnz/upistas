{# Facturas que cambiaron de resultado entre dos repasos. Espera `cambios` (upistas.aplicacion.lote.Cambio) y `lote`. #}
{% load panel_extras %}
<ul class="lista">
  {% for c in cambios %}
  <li>
    <a href="{% url 'panel:factura' lote c.file_id %}">{{ c.file_id }}</a>
    <span class="suave">pasa de</span> <span class="pildora {{ c.antes|pildora }}">{{ c.antes|etiqueta }}</span>
    <span class="suave">a</span> <span class="pildora {{ c.despues|pildora }}">{{ c.despues|etiqueta }}</span>
    <div class="suave">{{ c.motivo }}</div>
  </li>
  {% endfor %}
</ul>
