name: Trazabilidad PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  trazabilidad:
    runs-on: ubuntu-latest
    steps:
      - name: La PR enlaza una issue
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          fail=0
          echo "$BODY" | grep -Eiq '(closes|fixes|resolves|refs) #[0-9]+' || { echo "::error::Falta 'Closes #N' en la descripción"; fail=1; }
          exit $fail
