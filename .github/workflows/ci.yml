name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # El único obligatorio: capas + tests unitarios. Menos de un minuto con caché.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: La PR enlaza una issue (solo aviso)
        if: github.event_name == 'pull_request'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "$BODY" | grep -Eiq '(closes|fixes|resolves|refs) #[0-9]+' \
            || echo "::warning::La PR no enlaza ninguna issue (Closes #N o Refs #N en la descripción)"
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Dependencias (desde uv.lock, con caché)
        run: uv sync --extra dev --frozen
      - name: Capas
        run: uv run lint-imports
      - name: Tests unitarios
        run: uv run pytest tests/unit -q -x -p no:cacheprovider

  # Informativo: todo lo demás (contratos, outcomes, secretos, tests de integración con La Caja).
  # Se ve en la PR pero nunca bloquea.
  completo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Dependencias (desde uv.lock, con caché)
        run: uv sync --extra dev --frozen
      - name: La Caja (con caché)
        id: caja
        uses: actions/cache@v4
        with:
          path: caja
          key: caja-2026-09-19
      - name: Clonar La Caja si no está en caché
        if: steps.caja.outputs.cache-hit != 'true'
        run: git -c core.autocrlf=false clone --depth 1 --quiet https://github.com/ikurotime/500-sombras-de-alberto caja
      - name: Checks completos (contratos, capas, outcomes, secretos, todos los tests)
        env:
          CAJA_DIR: ${{ github.workspace }}/caja
        run: uv run python scripts/check.py
