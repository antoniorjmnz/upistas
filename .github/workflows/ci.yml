name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Dependencias (desde uv.lock, con caché)
        run: uv sync --extra dev --frozen
      - name: La Caja (repo oficial, público)
        run: git -c core.autocrlf=false clone --depth 1 --quiet https://github.com/ikurotime/500-sombras-de-alberto ../caja
      - name: Checks
        run: uv run python scripts/check.py
